name: update-formula

on:
  repository_dispatch:
    types: [tool-released]
  workflow_dispatch:
    inputs:
      tool:
        required: true
        description: Tool name
      component:
        default: cli
        type: choice
        options: [cli, desktop]
      tag:
        required: true
        description: Release tag
      repo:
        required: true
        description: Public release repository
      major:
        description: Major version (required for Zipover)

permissions:
  contents: write

concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release source
        id: release
        env:
          TOOL: ${{ github.event.client_payload.tool || inputs.tool }}
          COMPONENT: ${{ github.event.client_payload.component || inputs.component }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          REPO: ${{ github.event.client_payload.repo || inputs.repo }}
          MAJOR: ${{ github.event_name == 'repository_dispatch' && format('{0}', github.event.client_payload.major) || inputs.major }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TOOL" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]
          tag_major="${BASH_REMATCH[1]}"
          if [[ "$TOOL" == zipover ]]; then
            test "$MAJOR" = "$tag_major"
            case "$COMPONENT:$REPO" in
              cli:harrisonwang/zipover) ;;
              desktop:harrisonwang/zipover-releases) test "$MAJOR" = 1 ;;
              *) echo '::error::Unapproved Zipover release source'; exit 1 ;;
            esac
          else
            COMPONENT="${COMPONENT:-cli}"
            test "$COMPONENT" = cli
            test "$REPO" = "harrisonwang/$TOOL"
          fi
          if [[ "$COMPONENT" == desktop ]]; then
            output=Casks/zipover-gui.rb
            template=.github/homebrew/zipover-gui.rb.tmpl
            curl -fsSL "https://raw.githubusercontent.com/$REPO/main/channels/v1.json" -o channel.json
            test "$(jq -r .tag channel.json)" = "$TAG" || { echo '::error::Release is no longer the current Desktop channel'; exit 1; }
          else
            if [[ "$TOOL" == zipover ]]; then
              curl -fsSL "https://api.github.com/repos/$REPO/releases/latest" -o latest.json
              test "$(jq -r .tag_name latest.json)" = "$TAG" || { echo '::error::Release is no longer the latest CLI version'; exit 1; }
            fi
            output="Formula/${TOOL}.rb"
            template="src/.github/homebrew/formula.rb.tmpl"
          fi
          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"
          echo "template=$template" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - name: Test package renderer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Checkout public CLI source templates
        if: steps.release.outputs.component == 'cli'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.release.outputs.repo }}
          ref: ${{ steps.release.outputs.tag }}
          path: src
      - name: Verify downloads and render package
        env:
          TOOL: ${{ steps.release.outputs.tool }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ steps.release.outputs.repo }}
          TEMPLATE: ${{ steps.release.outputs.template }}
          OUTPUT: ${{ steps.release.outputs.output }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/$REPO/releases/download/$TAG/SHA256SUMS.txt" -o "$RUNNER_TEMP/SHA256SUMS.txt"
          python3 scripts/render_formula.py --template "$TEMPLATE" --checksums "$RUNNER_TEMP/SHA256SUMS.txt" --output "$OUTPUT" --verify-downloads
          ruby -c "$OUTPUT"
      - name: Render other tools' GUI casks
        if: steps.release.outputs.component == 'cli' && steps.release.outputs.tool != 'zipover'
        env:
          TOOL: ${{ steps.release.outputs.tool }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ steps.release.outputs.repo }}
        shell: bash
        run: |
          set -euo pipefail
          template="src/.github/homebrew/cask.rb.tmpl"
          if [[ -f "$template" ]]; then
            python3 scripts/render_formula.py --template "$template" --checksums "$RUNNER_TEMP/SHA256SUMS.txt" --output "Casks/${TOOL}-gui.rb" --verify-downloads
            ruby -c "Casks/${TOOL}-gui.rb"
          fi
      - name: Commit and push package update
        env:
          TOOL: ${{ steps.release.outputs.tool }}
          COMPONENT: ${{ steps.release.outputs.component }}
          TAG: ${{ steps.release.outputs.tag }}
          OUTPUT: ${{ steps.release.outputs.output }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT"
          if [[ "$COMPONENT" == cli && "$TOOL" != zipover && -f "Casks/${TOOL}-gui.rb" ]]; then
            git add "Casks/${TOOL}-gui.rb"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$TOOL $COMPONENT $TAG"
            git push
          fi
